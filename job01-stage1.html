const BRIEF=[
 {id:"what",title:"What an access review is",body:[
   "An access review checks that every account in a system is still needed, was properly approved, and gives the person only what their job requires.",
   "To check whether someone's access fits their job, you use a <b>role matrix</b>. It's a table, approved by whoever owns the system, that lists which roles each job is allowed. If someone has a role that isn't listed for their job, they have more access than they need.",
   "Finance systems are high risk: misuse could cause serious damage. There are two kinds. The first is <b>fraud</b>: money paid out wrongly, fake suppliers, wrong accounts. The second is a <b>data breach</b>: sensitive information such as staff salaries, bank details and tax ID numbers seen or copied by someone who shouldn't have it. That's why finance systems get more attention than most.",
   "Data protection law applies too. Most countries require serious data breaches to be reported to a regulator, often within days. In the EU, for example, the General Data Protection Regulation (GDPR) sets a 72-hour deadline.",
   "If one of those accounts fell into the hands of an attacker, such as a hacker who stole the password, they could pay themselves, change a supplier's bank details, copy staff and customer data, or cover their tracks. External auditors test these reviews every year for that reason."],
  ex:"Your job isn't to decide what access people should have. It's to compare what they have against what the policy says, and report the gaps.",
  q:"Why do auditors focus on access to finance systems?",
  opts:[["To keep software licence costs down",0,"Licence costs matter to IT, but that's not why auditors care."],["Because they're high risk: they hold sensitive financial data and run critical processes, so misuse or a breach could do serious damage",1,"Right. Finance systems usually hold sensitive information, such as bank account details, staff salaries, supplier payments and the company's accounts. They also run critical processes, such as paying staff and suppliers, collecting money from customers, and producing the financial reports the company is judged on. If the wrong person gets in, the result could be stolen money, missed payroll or wrong accounts. That's why access to them needs to be tightly controlled."],["Because IT asked them to",0,"Auditors set their own priorities, based on risk."]]},
 {id:"jml",title:"Joiners, movers and leavers",body:[
   "<b>Joiners</b> need an approved request before they get access. <b>Movers</b> change job and must lose the access they no longer need. <b>Leavers</b> must lose all access on or before their last working day, or at the moment they're told if they're dismissed.",
   "HR's list tells you who joined, moved or left, and when. Compare it with each account's status, roles and dates."],
  ex:"A leaver's access must be <b>disabled on or before their last day</b>.<br><br><b>Why it matters.</b> If the account stays open:<ul style='margin:6px 0 0;padding-left:18px'><li>A disgruntled leaver could delete records, change data or damage systems out of revenge.</li><li>Nobody is watching the account, so an attacker could use it without anyone noticing.</li><li>Auditors and regulators treat it as a failed control.</li></ul>",
  q:"Someone's last day is Friday 28 August. When must their access be disabled?",
  opts:[["On or before Friday 28 August",1,"Right. Access should go on or before the last working day, so there's no gap where a former employee can still log in. In practice this depends on HR telling IT in time, and that handover is where it usually breaks down. Leavers keeping access is one of the most common findings in any access review, and auditors always check for it."],["Monday 31 August, the next working day",0,"That leaves a whole weekend where a former employee could still log in. It must be on or before their last day."],["Within a week, once IT gets the ticket",0,"Far too late. A leaver's access should never outlive their employment."]]},
 {id:"sod",title:"Segregation of duties",body:[
   "No single person should be able to complete a sensitive transaction from start to finish. If one person can create a payment <b>and</b> approve it, nobody checks their work.",
   "<b>An everyday example:</b> you can submit an expense claim, but you can't approve it yourself. Your manager does. If you could do both, you could claim anything and nobody would know.",
   "<b>In a finance system:</b> a clerk creates a €5,000 payment to a supplier. A second person checks the invoice and approves it. If the clerk could also approve, they could set up a fake supplier, pay it, and nobody would ever see the payment.",
   "The <b>SoD matrix</b> lists the pairs of roles that must never sit on the same account. Check every account's roles against it.",
   "Any pair <b>not</b> on the matrix is allowed, even if it looks powerful."],
  ex:"You'll often hear: <i>\"He only does both when his manager is off.\"</i> Sometimes that's genuinely needed, but it has to be <b>signed off in writing</b> by someone senior. If there's no written sign-off, it's still a finding.",
  q:"Which of these is a segregation of duties conflict?",
  opts:[["One person can view finance reports and approve payments",0,"Viewing reports doesn't let them complete a payment on their own. No conflict."],["One person can create a payment and approve it",1,"Right. If one person can create a payment and approve it, nobody checks their work. They could pay a fake supplier or themselves, and it would look like a normal approved payment. Splitting the steps between two people means fraud needs two people working together, which is far less likely."],["Two people share the job of approving payments",0,"Sharing a task between people is fine. The problem is one person doing every step."]]},
 {id:"dormant",title:"Dormant and suspended accounts",body:[
   "A <b>dormant</b> account is one nobody has used for a long time. It's a risk because nobody is watching it. If someone else got hold of the password, nobody would notice them using it, whether to make changes or quietly copy data out.",
   "Most policies set a limit, such as a few months without a login, after which the account must be disabled.",

  ex:"Not everything that looks wrong is wrong. An old login date on its own isn't enough. Check why before you raise a finding.",
  q:"A colleague is starting six months of maternity leave. What should happen to her account?",

 {id:"tickets",title:"Approvals and shared accounts",body:[
   "Nobody should get access just by asking IT. Access should be <b>requested</b> and <b>approved</b> by the right people, usually their manager and whoever owns the system. That approval is the evidence that someone agreed the person needs it.",
   "In most organisations this happens through an <b>access request ticket</b> in the IT service desk system. The ticket records who asked, which roles, who approved it (usually the line manager and the system owner), and when IT set the access up. In the review, you compare the ticket with what the person actually has.",
   "Each case shows the account's <b>ticket history</b>. Approvals are tested for access granted <b>this quarter</b>. Older tickets were covered by earlier reviews, but they still tell you how the account was set up.",
   "People should get <b>exactly what was approved</b>, nothing extra. Extra access was never agreed by anyone.",
   "<b>Shared accounts</b>, where several people use one login, are a problem too. The system only records the shared login, not the person. So if a wrong payment is made or data is deleted, it can be difficult to trace which person did it. Best practice is one named account per person.",
   "Systems don't label an account as shared, so you have to spot it. Look for clues: <b>no employee ID</b>, <b>a name that isn't a person</b> (like \"Admin\" or \"Temp\"), and <b>no match on HR's records</b>."],
  ex:"Think of it like a building pass. Someone signs off what doors you can open, and the pass has your name on it. A pass nobody signed for, or one the whole team shares, defeats the point.",
  q:"A new starter was approved for access to enter invoices. Later they messaged someone in IT: \"I might need access to approve payments too.\" IT added it straight away. What's the problem?",
  opts:[["The extra access was never approved",1,"Right. A message to IT isn't an approval. Nobody with authority checked whether the new starter actually needed to approve payments. Combined with entering invoices, that access would let them create and approve their own payments. This is how access creep starts: small extras added informally, one request at a time."],["Nothing, the starter asked for it themselves",0,"Asking isn't the same as being approved. Their manager and the system owner never agreed to it."],["IT should have given them a shared login instead",0,"Shared logins make it impossible to tell who did what."]]},
 {id:"priv",title:"Privileged accounts",body:[
   "Most people have a <b>normal account</b>. It lets them do their own job and nothing more. In LedgerPoint, an AP Clerk can enter invoices, but can't approve them, change settings or give anyone access.",
   "A <b>privileged account</b> has more power than a normal account. What that means depends on the role. Some privileged roles can do one or two powerful things, such as resetting passwords or seeing data other users can't. The most powerful, such as a system administrator, can control the whole system: create and delete users, give anyone access (including themselves) and change how it works. In LedgerPoint, the privileged role is <b>Sys_Admin</b>.",
   "<b>Why the difference matters.</b> If a normal account is misused, the damage is limited to what that one person's job allows. A privileged account can reach much further, and the most powerful have very few limits. In the hands of a malicious user, such as an attacker who stole it or an employee acting in bad faith, the damage can be serious. Depending on what the role allows, they could:",
   "<ul><li><b>Steal data.</b> See and copy sensitive information such as customer, staff or financial data. That's a data breach.</li><li><b>Change or destroy data.</b> Alter or delete records, so the organisation can no longer trust its own information, and fraud can be hidden.</li><li><b>Shut the business down.</b> Lock people out, delete data or install ransomware, so the system can't be used.</li><li><b>Keep a way back in.</b> Create hidden accounts for themselves, so they can return even after the stolen password is changed.</li><li><b>Spread to other systems.</b> Privileged accounts often connect to other systems or hold their passwords. An attacker could use one as a stepping stone into email, file shares or HR systems, and do the same damage there. This is called lateral movement.</li></ul>",
   "A stolen normal account is a problem. A stolen privileged account can do far more harm, and the most powerful can take control of the whole system and reach beyond it. That's why privileged access is given out sparingly, and privileged accounts get extra attention in every access review."],
  ex:"Look at privileged accounts first. For each one, ask: does this person's job genuinely need this level of access? If it doesn't, that's a finding, and usually a serious one.",
  q:"Why do access reviews give privileged accounts extra attention?",
  opts:[["Because the people who hold them are more likely to be dishonest",0,"It's not about the people. Most admins are trustworthy. It's about what the account could do if it fell into the wrong hands."],["Because in the wrong hands they can do far more damage than a normal account",1,"Right. A stolen normal account is limited to what that one job allows. A privileged account can create users, change permissions and settings, and delete data, and can be a stepping stone into other systems. That's why privileged access is given out sparingly and checked first."],["Because they cost more in software licences",0,"Licence costs aren't the reason. The risk is what the account could be used to do."]]},
 {id:"severity",title:"Rating severity",body:[
   "Not every finding is equally serious. Severity tells the business which ones to fix first.",
   "To judge it, ask two questions: <b>what harm could this access do, by moving money or exposing sensitive data</b>, and <b>is it being used?</b>",
   "<b>Critical:</b> harm may be happening right now. <b>High:</b> could lead to fraud or a serious breach. <b>Medium:</b> a real gap, but less direct harm. <b>Low:</b> tidy-up, with little impact."],
  ex:"Severity is a judgement, so be ready to explain yours. Someone who can move money is very different from someone who can only look at reports. But looking still matters if the reports hold salaries or bank details.",
  q:"Which of these is the most serious?",

 {id:"judgement",title:"Escalate, report, or hold firm",body:[
   "Most findings go in your <b>report</b>, and the business fixes them in the normal way.",
   "<b>Escalate</b>, meaning tell your manager straight away, only when something could be causing harm right now. Raising the alarm too often means people stop listening.",
   "People will sometimes disagree with a finding. Stay polite and ask for <b>evidence</b>, like a written sign-off. If they can show it, drop the finding. If they can't, it stays."],
  ex:"You're not there to win arguments. You're there to make sure the report is backed by evidence.",
  q:"A manager says, \"That's always been allowed here.\" What should you do?",
  opts:[["Ask them to show you where it was approved",1,"Right. Ask for the evidence, such as a signed exception or an approval email. If they can show it, there's no finding and you've lost nothing. If they can't, the finding stays, and you've handled it politely and professionally. \"It's always been allowed\" often means it was agreed verbally years ago and never written down."],["Remove the finding to keep the peace",0,"That leaves a real risk unreported."],["Escalate it to your manager immediately",0,"Nothing urgent is happening. Ask for the evidence first."]]},
 {id:"policy",title:"The policy: your rulebook",body:[
   "A <b>policy</b> is a company's written rules for how something must be done. It's approved by senior management, so everyone in the company has to follow it.",
   "In an audit, the policy is what you <b>measure against</b>. You don't judge access by what seems sensible to you. You compare what you find with what the policy says should happen.",

  q:"Something looks risky to you, but you can't find a rule in the policy that it breaks. What should you do?",
  opts:[["Raise it as a finding anyway",0,"Without a rule behind it, the business can rightly push back. It's your opinion, not a breach."],["Don't raise a finding, but mention it to your manager as a possible gap in the policy",1,"Right. A finding needs a rule it breaks, or the business can rightly push back that it's just your opinion. But spotting risks the policy doesn't cover is valuable too. Raising them as policy gaps means the policy gets improved, and that's often where an auditor adds the most value."],["Ignore it",0,"A real risk is still worth mentioning, even if it isn't a finding."]]}

function feedback(id,d){
  const t=TRUTH[id];let ok,head,why,extra="";
  if(t){
    why=t.why;
    if(d.t==="flag"){
      const iOk=t.ok.includes(d.issue),cOk=d.cl.some(c=>t.cl.includes(c)),sd=Math.abs(SEVS.indexOf(d.sev)-SEVS.indexOf(t.sev));
      const notes=[];if(!iOk)notes.push(`the issue is better described as "${ISSUES[t.ok[0]]}"`);if(!cOk)notes.push(`the rule broken is ${t.cl.join(" or ")}`);if(sd)notes.push(`severity should be ${t.sev} (${SEVHELP[t.sev].replace(/\.$/,"").toLowerCase()})`);
      ok=iOk&&cOk&&!sd?"yes":iOk&&cOk?"part":"part";head=iOk&&cOk&&!sd?"Correct. This is a finding.":iOk&&cOk?"Right finding, different severity.":"Right to raise it, but some details are off.";
      if(notes.length)extra=`Note: ${notes.join("; ")}.`;
    } else if(d.t==="gap"){ok="no";head="Not quite. The policy does cover this, so it's a finding."}
    else {ok="no";head=d.dropped?"You removed this finding after Sinéad's pushback.":"Not quite. This one breaks the policy."}
    if(id==="cbyrne"&&!S.escal.includes("cbyrne"))extra+=` <b>This is also a live security issue.</b> Someone used the account after he left. Use <b>Escalate to Aoife</b> now.`;
  } else if(id==="fkerr"){
    why=FINE[id];
    if(d.t==="gap"){ok="yes";head="Correct. This is a policy gap."}
    else if(d.t==="flag"){ok="no";head="Not quite. No rule is broken here, so it can't be a finding."}
    else {ok="no";head="Not quite. Nothing's broken, but something is missing from the policy."}
  } else {
    why=FINE[id];
    if(d.t==="ok"){ok="yes";head="Correct. No issue."}
    else if(d.t==="flag"){ok="no";head="Not quite. This one meets the policy."}
    else {ok="no";head="Not quite. The policy covers this, and it's met."}

  const col=ok==="yes"?"var(--green)":ok==="part"?"var(--amber)":"var(--red)",bg=ok==="yes"?"var(--green-soft)":ok==="part"?"var(--amber-soft)":"var(--red-soft)";

function stamp(t){
  const id=ORDER[S.i];
  if(t==="flag"){
    const issue=document.querySelector('input[name="issue"]:checked'),cl=[...document.querySelectorAll('input[name="cl"]:checked')].map(i=>i.value),sev=document.querySelector('input[name="sev"]:checked');
    if(!issue||!cl.length||!sev){const e=$("err");e.textContent="Pick an issue, at least one clause and a severity.";e.hidden=false;return}
    S.dec[id]={t:"flag",issue:issue.value,cl,sev:sev.value};
  } else {
    S.dec[id]={t};
  }
  FLAGOPEN=false;render();
  if(t==="flag"&&id==="mdoherty"&&!S.push){setTimeout(pushback,700);return}
  if(S.mode==="training")return;
  setTimeout(()=>{const nx=ORDER.findIndex((k,n)=>n>S.i&&!S.dec[k]),any=ORDER.findIndex(k=>!S.dec[k]);const to=nx>=0?nx:any;if(to>=0){S.i=to;render()}},650);
}

const RECS={
 leaver_active:"Disable the account now and review all activity since the leaving date. Make sure HR's leaver notices reach IT so accounts are disabled on the last day.",
 late_removal:"Confirm the account is disabled. Make sure HR's leaver notices reach IT so accounts are disabled on the last day.",
 mover:"Remove the access no longer needed for the new role. Add an access review step to the role-change process.",
 sod:"Remove one of the conflicting roles. If both are genuinely needed, get a written, approved exception and an independent review of this person's transactions.",
 dormant:"Disable the account. Run a regular check for accounts unused for 90 days.",
 generic:"Disable the shared account and give each person who used it their own named account.",
 no_request:"Raise an access request for retrospective approval, or remove the access.",
 excess:"Remove the access that wasn't approved, and check that provisioning always matches the ticket.",
 not_in_matrix:"Remove roles not allowed for the person's job, or update the role matrix if the job genuinely needs them."
};

  return Object.entries(S.dec).filter(([k,d])=>d.t==="flag").sort((a,b)=>SEVS.indexOf(b[1].sev)-SEVS.indexOf(a[1].sev))
    .map(([k,d])=>({name:U[k][0],id:k,issue:ISSUES[d.issue],rule:d.cl.map(c=>`${c} ${CLAUSES[c]}`).join(", "),sev:d.sev,rec:RECS[d.issue]||""}));
}
function reportText(){
  const rows=reportRows(),gaps=Object.entries(S.dec).filter(([k,d])=>d.t==="gap");
  const L=["LedgerPoint user access review, Q3 2026","Northbay Payments","Prepared by: Junior GRC Analyst","Scope: all LedgerPoint accounts, 1 July to 30 September 2026, tested against the Access Control Policy v3.2","",`Findings (${rows.length})`,""];
  rows.forEach((r,i)=>L.push(`${i+1}. ${r.issue}: ${r.name} (${r.id})`,`   Rule broken: ${r.rule}`,`   Severity: ${r.sev}`,`   Recommendation: ${r.rec}`,""));
  if(S.escal.length)L.push("Escalated during the review",...S.escal.map(k=>`- ${U[k][0]} (${k})`),"");

function debrief(){
  let got=0,max=0;const res=[],fps=[];let sevHi=0,sevLo=0,clBad=0;
  for(const[k,t]of Object.entries(TRUTH)){
    const b=PTS[t.sev];max+=b+10;const d=S.dec[k];
    if(!d||d.t!=="flag"){res.push({k,t,s:"miss"});continue}
    let p=t.ok.includes(d.issue)?b:Math.round(b/2);const clOk=d.cl.some(c=>t.cl.includes(c));if(clOk)p+=5;else clBad++;
    const diff=SEVS.indexOf(d.sev)-SEVS.indexOf(t.sev),sd=Math.abs(diff);if(diff>0)sevHi++;if(diff<0)sevLo++;
    p+=sd===0?5:sd===1?2:0;got+=p;
    const notes=[];if(!t.ok.includes(d.issue))notes.push(`you called it "${ISSUES[d.issue]}"`);if(!clOk)notes.push(`the rule is ${t.cl.join(" or ")}`);if(sd)notes.push(`severity should be ${t.sev}`);
    res.push({k,t,s:t.ok.includes(d.issue)&&clOk?"hit":"part",notes});
  }
  for(const[k,d]of Object.entries(S.dec))if(d.t==="flag"&&!TRUTH[k]){fps.push(k);got-=10}
  max+=25;if(S.escal.includes("cbyrne"))got+=25;
  const badEsc=S.escal.filter(k=>k!=="cbyrne");got-=5*badEsc.length;
  /* Professional skills: scored separately from the technical score */
  const PROF={ask:[2,"Asked Sinéad for the written approval. Evidence first, and the relationship stays intact."],escalate:[1,"Kept the finding, but passed it to Aoife instead of asking Sinéad for the evidence yourself."],drop:[0,"Removed the finding to keep the peace. With no written sign-off, the policy was still broken."]};
  const profItems=[];
  if(PROF[S.push])profItems.push({title:"Sinéad's pushback on Mark Doherty",pts:PROF[S.push][0],max:2,note:PROF[S.push][1]});
  const profGot=profItems.reduce((a,b)=>a+b.pts,0),profMax=profItems.reduce((a,b)=>a+b.max,0);
  const profLabel=!profMax?"Not tested":profGot===profMax?"Strong":profGot>0?"Getting there":"Needs work";
  max+=10;const fk=S.dec.fkerr,gapOk=fk&&fk.t==="gap";if(gapOk)got+=10;
  const badGaps=Object.entries(S.dec).filter(([k,d])=>d.t==="gap"&&k!=="fkerr").map(([k])=>k);got-=5*badGaps.length;
  got=Math.max(0,got);const pct=Math.round(got/max*100);
  const grade=pct>=85?"Ready for promotion":pct>=65?"Solid analyst work":pct>=40?"Needs another pass":"Back to basics";
  const found=res.filter(r=>r.s!=="miss").length,escOk=S.escal.includes("cbyrne");
  const names=a=>a.length<3?a.join(" and "):a.slice(0,-1).join(", ")+" and "+a[a.length-1];

  /* Aoife's message */
  const open=pct>=85?"Really good work on your first review.":pct>=65?"Solid first review.":pct>=40?"A decent start, but there's more to tighten up.":"Thanks for this. It needs another pass before it goes to the audit committee.";
  const esc1=escOk?"Escalating Ciarán Byrne straight away was the right call. That was the one that mattered most.":"The big one: Ciarán Byrne used his account after he left. That needed to come to me straight away, not just go in the report.";
  const sum=`You found ${found} of 7 findings${fps.length?` and raised ${fps.length} on account${fps.length>1?"s":""} that met the policy`:", with no false alarms"}.`;

  /* what to work on */
  const pri=[];
  if(!escOk)pri.push(["Escalate live security issues straight away","Ciarán Byrne logged in five weeks after leaving, with access to change supplier bank details. Harm could be happening now, so tell your manager immediately, then put it in the report.","judgement"]);
  if(S.push==="drop")pri.push(["Hold firm when there's no evidence","You removed Mark Doherty's finding after Sinéad pushed back. There was no written sign-off, so the policy was still broken. Ask for the evidence before dropping a finding.","judgement"]);
  const missBy={};res.filter(r=>r.s==="miss"&&!(r.k==="mdoherty"&&S.push==="drop")).forEach(r=>{(missBy[REVIEW[r.k]]=missBy[REVIEW[r.k]]||[]).push(U[r.k][0])});
  Object.entries(missBy).sort((a,b)=>b[1].length-a[1].length).forEach(([card,n])=>pri.push([`Missed ${n.length===1?"a finding":n.length+" findings"}: ${BRIEF[cardIdx(card)].title.toLowerCase()}`,`Look again at ${names(n)}. ${n.length===1?"It breaks":"Each one breaks"} a rule in the policy.`,card]));
  if(fps.length)pri.push(["Check the whole rule before raising a finding",`${names(fps.map(k=>U[k][0]))} met the policy. Not everything that looks wrong is wrong, and false alarms cost you credibility with the business.`,REVIEW[fps[0]]]);
  if(sevHi+sevLo>=2)pri.push([sevHi>=sevLo?"You tend to rate severity too high":"You tend to rate severity too low",`${sevHi+sevLo} of your findings had the wrong severity. Ask two questions: what harm could this access do, and is it being used?`,"severity"]);
  if(clBad>=2)pri.push(["Match each finding to the right rule",`${clBad} findings quoted a rule that doesn't fit. Check the policy wording before you choose.`,"policy"]);
  if(!gapOk)pri.push(["Look for gaps, not just breaches","Fiona Kerr's access has no end date, and contractors aren't on HR's leavers list. No rule was broken, but nothing would ever remove her access. That's worth raising as a gap in the policy.","policy"]);
  if(badEsc.length)pri.push(["Save escalations for live issues",`${names(badEsc.map(k=>U[k][0]))} didn't need escalating. Put policy breaches in the report.`,"judgement"]);
  const top=pri.slice(0,3);

  /* what went well */
  const good=[];
  if(escOk)good.push("Escalated the live security issue straight away");
  if(found>=5)good.push(`Found ${found} of the 7 findings`);
  if(!fps.length&&found>0)good.push("No false alarms: every finding you raised was a real breach");
  if(S.push==="ask")good.push("Handled Sinéad's pushback by asking for evidence");
  if(gapOk)good.push("Spotted the gap in the policy on contractor end dates");
  if(found>0&&sevHi+sevLo===0)good.push("Every severity rating was right");

  const rows=reportRows();
  const rowHTML=rows.map(r=>`<tr><td><b>${esc(r.name)}</b><br><span class="small muted mono">${esc(r.id)}</span></td><td>${esc(r.issue)}</td><td class="m" style="white-space:normal">${esc(r.rule)}</td><td>${esc(r.sev)}</td><td class="small">${esc(r.rec)}</td></tr>`).join("");

  /* full breakdown (unchanged detail) */
  const item=r=>`<div class="item ${r.s}"><span class="tag">${r.s==="hit"?"Found":r.s==="part"?"Partly right":"Missed"} · ${r.t.sev}</span><b>${esc(U[r.k][0])}: ${esc(r.t.title)}</b><span class="small muted">${esc(r.t.why)}</span>${r.notes&&r.notes.length?`<span class="small" style="color:var(--amber)">Note: ${r.notes.join("; ")}.</span>`:""}${r.s!=="hit"?`<button class="btn" style="justify-self:start;margin-top:4px" data-review="${REVIEW[r.k]}">Review: ${esc(BRIEF[cardIdx(REVIEW[r.k])].title)}</button>`:""}</div>`;
  const nextBtn=`<button class="btn primary" data-act="restart">Play again</button>`;

  $("app").innerHTML=`<div class="sheet" style="max-width:880px">
   <div class="who">${AOIFE_FACE()}<div><b>Debrief from Aoife</b><div class="small muted">LedgerPoint Q3 access review</div></div></div>
   <div class="db-msg"><p>${open} ${esc1}</p><p>${sum}${top.length?" Here's what I'd work on next.":" Great work."}</p></div>

   <div class="score">
    <div><span class="small muted">Technical</span><b>${pct}%</b><span class="small" style="font-family:var(--hand);color:var(--red)">${grade}</span><span class="small muted" style="display:block">Findings, rules, severity, escalation, policy gaps</span></div>
    <div><span class="small muted">Professional skills</span><b>${profMax?`${profGot}/${profMax}`:"–"}</b><span class="small" style="font-family:var(--hand);color:var(--accent)">${profLabel}</span><span class="small muted" style="display:block">How you handled the people side</span></div>
   </div>
   <div class="res"><h3>Professional skills</h3>
    ${profItems.length?profItems.map(p=>`<div class="item ${p.pts===p.max?"hit":p.pts>0?"part":"miss"}"><span class="tag">${p.pts}/${p.max}</span><b>${esc(p.title)}</b><span class="small muted">${esc(p.note)}</span></div>`).join(""):`<p class="small muted" style="margin:0">Not tested this time. You didn't flag Mark Doherty, so Sinéad never pushed back. Replay and raise his finding to face her.</p>`}
   </div>

   ${top.length?`<div class="res"><h3>What to work on</h3><ol class="db-list">${top.map(p=>`<li><b>${p[0]}</b><span class="small muted">${p[1]}</span><button class="btn" style="justify-self:start" data-review="${p[2]}">Review: ${esc(BRIEF[cardIdx(p[2])].title)}</button></li>`).join("")}</ol></div>`:""}
   ${good.length?`<div class="res"><h3>What you did well</h3><ul class="db-good">${good.slice(0,3).map(g=>`<li>${g}</li>`).join("")}</ul></div>`:""}

   <div class="res"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px"><h3>Your findings report</h3><button class="btn" data-act="copyreport">Copy report</button></div>
    <p class="small muted" style="margin:0">This is the report you submitted. Copy it into a document for your portfolio. It shows employers you can carry out an access review.</p>
    ${rows.length?`<div style="overflow-x:auto"><table class="db-report"><thead><tr><th>Account</th><th>Issue</th><th>Rule broken</th><th>Severity</th><th>Recommendation</th></tr></thead><tbody>${rowHTML}</tbody></table></div>`:`<p class="small muted" style="margin:0">You didn't raise any findings.</p>`}
   </div>

   <details class="db-more"><summary>Full case-by-case breakdown</summary>
    <div class="res"><p class="small muted" style="margin:0">Technical score ${pct}% ·<span style="font-family:var(--hand);color:var(--red)">${grade}</span></p>
     <h3>Findings</h3>${res.map(item).join("")}
     ${fps.length?`<h3>False alarms</h3>${fps.map(k=>`<div class="item miss"><b>${esc(U[k][0])}</b><span class="small muted">${esc(FINE[k])}</span><button class="btn" style="justify-self:start;margin-top:4px" data-review="${REVIEW[k]}">Review: ${esc(BRIEF[cardIdx(REVIEW[k])].title)}</button></div>`).join("")}`:""}
     ${badGaps.length?`<h3>Not policy gaps</h3>${badGaps.map(k=>`<div class="item miss"><b>${esc(U[k][0])}</b><span class="small muted">${TRUTH[k]?`The policy does cover this. It's a finding: ${esc(TRUTH[k].title)}.`:esc(FINE[k])}</span></div>`).join("")}`:""}
     <h3>Correctly cleared</h3><p class="small muted" style="margin:0">${Object.keys(FINE).filter(k=>k!=="fkerr"&&S.dec[k]&&S.dec[k].t==="ok").map(k=>esc(U[k][0])).join(", ")||"None"}</p>

   <div class="res"><h3>What's next</h3><p style="margin:0">Next, <a href='job01-stage2.html' target='_blank' rel='noopener'><b>Stage 2: write the report</b></a> for these findings.</p><p class="small muted" style="margin:0">Want to go further on privileged access? <a href='job03-stage1.html' target='_blank' rel='noopener'>Job 03: Privileged access review</a> looks at admin access in Microsoft Entra.</p>
    <div class="row" style="justify-content:flex-start">${nextBtn}<button class="btn" data-act="review">Back to the cases</button></div></div>
  </div>`;

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-stamp],[data-go],[data-rtab],[data-push],[data-ans],[data-bgo],[data-review],[data-mode]");if(!t)return;const d=t.dataset;
  if(d.ans!=null){S.bAns[S.b]=+d.ans;render();return}
  if(d.bgo!=null){S.b=+d.bgo;render();window.scrollTo({top:0});return}
  if(d.mode){S.mode=d.mode;save();renderStats();return}
  if(d.review){S.ret=S.stage==="cases"?"cases":"debrief";S.b=cardIdx(d.review);S.stage="brief";render();window.scrollTo({top:0});return}
  if(d.stamp){stamp(d.stamp);return}
  if(d.go){S.i=+d.go;FLAGOPEN=false;render();return}
  if(d.rtab){S.rtab=d.rtab;save();const r=document.querySelector(".rules");if(r){r.innerHTML=rulebook();if(window.innerWidth<900)r.scrollIntoView({behavior:"smooth"})}else render();return}
  if(d.push){answerPush(d.push);return}
  const a=d.act;
  if(a==="start"||a==="skipbrief"||a==="startjob"){S.stage="cases";S.ret=null;render();window.scrollTo({top:0});return}
  if(a==="beginbrief"){S.stage="brief";S.b=0;S.ret=null;render();return}
  if(a==="openbrief"){S.stage="brief";S.ret="cases";render();window.scrollTo({top:0});return}
  if(a==="bnext"){S.b=Math.min(BRIEF.length-1,S.b+1);render();window.scrollTo({top:0});return}
  if(a==="bprev"){S.b=Math.max(0,S.b-1);render();window.scrollTo({top:0});return}
  if(a==="todebrief"){S.stage="debrief";S.ret=null;render();window.scrollTo({top:0});return}
  if(a==="tocases"){S.stage="cases";S.ret=null;render();return}
  if(a==="openflag"){FLAGOPEN=true;$("tray").innerHTML=tray(ORDER[S.i],S.dec[ORDER[S.i]]);const f=document.querySelector('input[name="issue"]');f&&f.focus();return}
  if(a==="cancelflag"){FLAGOPEN=false;$("tray").innerHTML=tray(ORDER[S.i],S.dec[ORDER[S.i]]);return}
  if(a==="prev"){S.i=Math.max(0,S.i-1);FLAGOPEN=false;render();return}
  if(a==="next"){S.i=Math.min(ORDER.length-1,S.i+1);FLAGOPEN=false;render();return}
  if(a==="escalate"){openEscalate();return}
  if(a==="sendesc"){sendEsc();return}
  if(a==="close"){if(e.target===t||t.tagName==="BUTTON")$("modal").innerHTML="";return}
  if(a==="nextopen"){const nx=ORDER.findIndex((k,n)=>n>S.i&&!S.dec[k]),any=ORDER.findIndex(k=>!S.dec[k]);const to=nx>=0?nx:any;if(to>=0)S.i=to;render();window.scrollTo({top:0});return}
  if(a==="closepush"){$("modal").innerHTML="";if(S.mode==="training"){render();return}const nx=ORDER.findIndex(k=>!S.dec[k]);if(nx>=0)S.i=nx;render();return}
  if(a==="replayjob"){S=fresh();S.mode="job";S.stage="cases";FLAGOPEN=false;try{localStorage.removeItem(KEY)}catch(err){}render();window.scrollTo({top:0});return}
  if(a==="copyreport"){const txt=reportText();const fb=()=>{$("modal").innerHTML=`<div class="scrim" data-act="close"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ch"><h2 id="ch">Your report</h2><p class="small muted">Select all the text and copy it.</p><textarea id="ct" style="min-height:260px;font-family:var(--mono);font-size:12px" readonly>${esc(txt)}</textarea><div class="row"><button class="btn" data-act="close">Close</button></div></div></div>`;const ta=$("ct");ta.focus();ta.select()};
    try{navigator.clipboard.writeText(txt).then(()=>toast("Report copied. Paste it into a document."),fb)}catch(err){fb()}return}
  if(a==="finish"){S.stage="debrief";render();window.scrollTo({top:0});return}
  if(a==="review"){S.stage="cases";render();return}
  if(a==="restart"){if(t.dataset.sure){S=fresh();FLAGOPEN=false;try{localStorage.removeItem(KEY)}catch(err){}$("modal").innerHTML="";render();return}
    t.dataset.sure="1";const old=t.textContent;t.textContent="Click again to restart";setTimeout(()=>{if(t.isConnected){delete t.dataset.sure;t.textContent=old}},3000);return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("modal").innerHTML&&S.push!=="open")$("modal").innerHTML=""});
if(S.push==="open")pushback();
render();
</script>

=\"226\" cy=\"440\" rx=\"21\" ry=\"9\" fill=\"#8a2f3c\"/><rect x=\"189\" y=\"182\" width=\"22\" height=\"34\" rx=\"8\" fill=\"#ecc0a4\"/><path d=\"M146 228 Q200 204 254 228 L264 338 Q200 352 136 338 Z\" fill=\"#5d6879\"/><path d=\"M184 212 L200 256 L216 212 Z\" fill=\"#c9d3df\"/><path d=\"M184 212 L200 256 L176 244 L170 220 Z\" fill=\"#4a5363\"/><path d=\"M216 212 L200 256 L224 244 L230 220 Z\" fill=\"#4a5363\"/><circle cx=\"200\" cy=\"290\" r=\"3.5\" fill=\"#2b3340\"/><circle cx=\"200\" cy=\"312\" r=\"3.5\" fill=\"#2b3340\"/><g transform=\"rotate(6 236 290)\"><rect x=\"206\" y=\"250\" width=\"58\" height=\"80\" rx=\"5\" fill=\"#1b2a4a\"/><rect x=\"214\" y=\"262\" width=\"42\" height=\"24\" rx=\"3\" fill=\"#fff\"/><rect x=\"219\" y=\"268\" width=\"30\" height=\"4\" rx=\"2\" fill=\"#1b2a4a\"/><rect x=\"219\" y=\"276\" width=\"20\" height=\"4\" rx=\"2\" fill=\"#9aa6b2\"/></g><path d=\"M250 238 Q266 286 236 300\" fill=\"none\" stroke=\"#5d6879\" stroke-width=\"26\" stroke-linecap=\"round\"/><circle cx=\"232\" cy=\"300\" r=\"12\" fill=\"#f6d0b6\"/><path d=\"M150 238 L140 296\" fill=\"none\" stroke=\"#5d6879\" stroke-width=\"26\" stroke-linecap=\"round\"/><circle cx=\"142\" cy=\"304\" r=\"13\" fill=\"#f6d0b6\"/><circle cx=\"200\" cy=\"140\" r=\"54\" fill=\"#f6d0b6\"/><circle cx=\"146\" cy=\"146\" r=\"9\" fill=\"#f6d0b6\"/><circle cx=\"254\" cy=\"146\" r=\"9\" fill=\"#f6d0b6\"/><circle cx=\"146\" cy=\"158\" r=\"3.5\" fill=\"#c9d3df\"/><circle cx=\"254\" cy=\"158\" r=\"3.5\" fill=\"#c9d3df\"/><circle cx=\"200\" cy=\"76\" r=\"22\" fill=\"#d8b25e\"/><path d=\"M146 140 Q140 86 200 84 Q260 86 254 140 Q248 108 222 102 Q200 98 180 104 Q152 112 146 140 Z\" fill=\"#e2bf6c\"/><path d=\"M180 104 Q198 96 226 100\" fill=\"none\" stroke=\"#c9a14c\" stroke-width=\"3\"/><circle cx=\"171\" cy=\"161\" r=\"8\" fill=\"#ef9a90\" opacity=\".6\"/><circle cx=\"229\" cy=\"161\" r=\"8\" fill=\"#ef9a90\" opacity=\".6\"/><path d=\"M174 130 Q183 126 192 129\" fill=\"none\" stroke=\"#a07c34\" stroke-w <!--GLOSSARY--><script>
/* ---------- Glossary: click a dotted term to open its explanation ---------- */
(function(){
const G=[
 ["grc","GRC",/\bGRC\b(?! (Manager|Officer|Analyst))/,"Governance, risk and compliance. The work of making sure an organisation is run properly, understands its risks, and follows the laws, standards and rules that apply to it.","Checking who has access to the finance system, assessing a new supplier, or writing a security policy.","It's the umbrella name for the jobs this game prepares you for."],
 ["framework","Framework",/\bframeworks?\b/i,"An agreed set of good practices, published by a professional body or standards organisation. Organisations use it as a checklist for doing something properly.","ISO 27001 for information security, ISACA's ITAF for IT audit, the IIA Standards for internal audit.","Frameworks tell you what good looks like. Employers expect you to know the main ones by name."],
 ["itaf","ISACA ITAF",/\b(ISACA )?ITAF\b/,"ISACA's IT Audit Framework: standards and guidance for people who audit IT systems and controls. ISACA also runs the CISA certification.","How to plan an IT audit, gather evidence from systems, and report the results.","It's the main reference for audits like the access reviews in this game."],
 ["iia","IIA Standards",/\bIIA( Global Internal Audit)? Standards\b/,"The Global Internal Audit Standards, published by the Institute of Internal Auditors. They set out how internal audit work should be planned, done and reported.","Every finding should state the criteria, condition, cause, effect and recommendation.","The most widely recognised standard for internal audit worldwide."],
 ["audit","Audit",/\baudits?\b/i,"An independent check of whether something is done the way it should be, based on evidence, against agreed rules.","Testing every finance system account against the access control policy.","Audits give management and regulators confidence that controls actually work."],
 ["portfolio","Portfolio",/\bportfolio\b/i,"A collection of real work you can show an employer, like a report you wrote or an action plan you agreed.","The findings report you copy at the end of each job.","Hard to get without experience. This game gives you one."],
 ["accessreview","Access review",/\baccess reviews?\b/i,"A regular check that every account in a system is still needed, was properly approved, and has only the access the person's job requires.","Each quarter, the system owner confirms that everyone with access to the finance system should still have it.","One of the most common controls auditors test, and a typical first task for a junior analyst."],
 ["rolematrix","Role matrix",/\b(privileged )?role matrix\b/i,"A table, approved by the system owner, listing which roles each job is allowed in a system.","AP Clerk: AP_Clerk role only.","It's how you tell whether someone's access fits their job."],
 ["sod","Segregation of duties",/\bsegregation of duties\b|\bSoD\b/i,"Splitting a sensitive task so no single person can complete it from start to finish without someone else checking.","The person who creates a payment can't also approve it.","It's one of the most important controls against fraud and errors."],
 ["leastpriv","Least privilege",/\bleast privilege\b/i,"Giving people only the access their job needs, and nothing more.","A clerk who enters invoices doesn't need the right to release payments.","Less access means less damage if an account is misused or stolen."],
 ["jml","Joiners, movers and leavers",/\bjoiners?, movers? and leavers?\b|\bleavers?\b|\bmovers?\b/i,"People starting, changing job, or leaving. Each event should trigger an access change: new access for joiners, removal of old access for movers, removal of all access for leavers.","Someone leaves on Friday, so their access must be disabled on or before Friday.","Leaver and mover access left behind is one of the most common audit findings."],
 ["dormant","Dormant account",/\bdormant\b/i,"An account nobody has used for a long time.","No login for 200 days.","Nobody is watching it, so misuse could go unnoticed."],
 ["shared","Shared account",/\bshared (or generic )?accounts?\b|\bgeneric accounts?\b/i,"One login used by several people.","A \"Finance Temp\" account used by whoever is covering at month-end.","The system can't tell who actually did what, so actions are hard to trace."],
 ["policy","Policy",/\bpolic(y|ies)\b/i,"An organisation's written, approved rules for how something must be done. Everyone has to follow it.","The Access Control Policy says leavers' access is removed on or before their last day.","In an audit, the policy is what you measure against."],
 ["policygap","Policy gap",/\bpolicy gaps?\b|\bgaps? in the policy\b/i,"A real risk that no rule in the policy covers. It isn't a breach, because nothing is broken, but the policy should be improved.","Contractor access with no end date, when the policy doesn't require one.","Reported as an observation, with a recommendation to update the policy."],
 ["finding","Finding",/\bfindings?\b/i,"Something an audit found that breaks an agreed rule, backed by evidence.","A leaver can still log in, which breaks the rule that access must be removed by their last day.","Findings go in the report, and each one gets an owner, an action and a date."],
 ["severity","Severity",/\bseverity\b/i,"How serious a finding is: Low, Medium, High or Critical.","A leaver using the account after leaving is Critical. An unused read-only account is Low.","It tells the business what to fix first, and sets the deadline."],
 ["escalate","Escalate",/\bescalat(e|ed|es|ing|ion|ions)\b/i,"Telling your manager straight away, instead of waiting for the report.","A former employee logged in last week. Tell your manager now.","Only for things that could be causing harm right now."],
 ["exception","Exception",/\bexceptions?( register)?\b/i,"Formal, written approval to break a rule for a good reason, usually signed by a senior person such as the CISO and recorded in an exceptions register.","Approval for someone to hold two conflicting roles while covering a vacancy, with extra checks.","Without a recorded exception, \"it's always been allowed\" is still a breach."],
 ["tor","Terms of reference",/\bterms of reference\b/i,"The agreed plan for an audit: objective, scope, criteria, evidence needed, timeline and who's involved.","Agreed with the system owner before testing starts.","It prevents arguments later about what was covered."],
 ["scope","Scope",/\bscope\b/i,"What an audit covers and what it doesn't: the system, the time period, and anything left out.","LedgerPoint user access, July to September 2026. Service accounts out of scope.","Readers assume anything not mentioned was checked, so scope must be clear."],
 ["scopelim","Scope limitation",/\bscope limitations?\b/i,"Something the audit should have covered but couldn't, or was asked to leave out.","Login records were only kept for 30 days, so you couldn't check who used their account earlier in the quarter.","It must be stated in the report so nobody assumes that area was checked."],
 ["criteria","Criteria",/\bcriteria\b/i,"The rules you test against: policies, standards, matrices or laws.","Access Control Policy v3.2 and the role matrix.","No criteria, no finding. Without a rule, it's just an opinion."],
 ["rootcause","Root cause",/\broot causes?\b/i,"The underlying reason a problem happened, as opposed to the problem itself.","Leavers keep their access because HR's leaver notices don't reach IT.","Fixing the root cause stops the same finding coming back."],
 ["execsum","Executive summary",/\bexecutive summar(y|ies)\b/i,"A short paragraph at the top of a report for senior readers: what was reviewed, the headline result, the most serious issue and what to do.","The audit committee may read nothing else.","Write it last, in plain language."],
 ["opinion","Overall opinion",/\boverall opinion\b/i,"A one-line rating of the whole audit, such as Satisfactory, Needs improvement or Unsatisfactory.","Unsatisfactory: one Critical and four High findings.","It's the first thing senior readers look at."],
 ["wp","Working papers",/\bworking papers?\b/i,"The evidence and notes behind an audit, each with a reference such as WP2.","WP2: the user export, with a note of how it was checked.","Anyone should be able to check a finding by following its working paper reference."],
 ["mgmtresp","Management response",/\bmanagement responses?\b/i,"The owner's written reply to a finding, in their own words: Agreed, Partly agreed or Not agreed.","\"Agreed. The weekly leaver check will be in place by 3 December.\"","It shows management accepts the finding and commits to fixing it."],
 ["findingscall","Findings call",/\bfindings call\b|\bclosing meeting\b/i,"A meeting near the end of an audit where the auditor and the owners agree an action, owner and date for each finding.","Held after the draft report has been reviewed.","Its output, the action plan, is what gets followed up."],
 ["actionplan","Action plan",/\baction (plan|tracker)s?\b/i,"The list of agreed fixes: what will be done, who owns it, by when, and the evidence that will prove it's done.","Set up a weekly check of leavers. Owner: the IT manager. Due: 3 December. Evidence: four weeks of check records.","Audit tracks it and closes each action only after checking the evidence."],
 ["draft","Draft report",/\bdraft reports?\b/i,"The first version of an audit report, sent to the owners to check facts before it's finalised.","Sent with a cover email asking for comments by a date.","It avoids surprises and catches factual errors."],
 ["owner","System owner",/\bsystem owners?\b/i,"The senior person ultimately accountable for a system, including who can use it.","The head of Finance owns the finance system and is ultimately accountable for it. If someone needs access, they decide yes or no. IT then sets it up.","They approve access and the role matrix, and own most audit actions for their system."],
 ["ciso","CISO",/\bCISO\b/,"Chief Information Security Officer: the senior person responsible for information security.","Owns the security policies and approves exceptions.","Usually the policy owner, and a key reader of audit reports."],
 ["committee","Audit committee",/\baudit committee\b/i,"A group of board members who oversee audit, risk and controls.","Receives the final report through the GRC Manager.","It's the most senior audience for an audit report."],
 ["observation","Observation",/\bobservations?\b/i,"Something worth reporting that doesn't break a rule, such as a policy gap or an improvement.","No policy requires contractor access to have an end date.","Reported separately from findings, with no severity rating."],
 ["entra","Microsoft Entra ID",/\b(Microsoft )?Entra( ID)?\b/,"Microsoft's cloud identity system, previously called Azure AD. It controls who can sign in to Microsoft 365 and Azure, and what they can do.","Every Northbay staff account lives in Entra ID.","Whoever controls Entra ID controls access to email, files and cloud systems."],
 ["pim","PIM",/\bPIM\b|\bPrivileged Identity Management\b/,"Privileged Identity Management: a Microsoft Entra feature that makes admin roles \"just-in-time\". People activate a role only when they need it, for a limited time, with controls like MFA and approval.","An admin activates Global Administrator for two hours, with a justification.","It reduces standing admin access, a favourite target for attackers."],
 ["priv","Privileged access",/\bprivileged access\b|\badmin roles?\b/i,"Access with elevated rights compared with a standard user account, such as creating, changing or deleting users, permissions, settings and data.","Sys_Admin in LedgerPoint, or Global Administrator in Microsoft Entra.","In the wrong hands it can do serious damage, so it's given out sparingly and checked first in any access review."],
 ["ga","Global Administrator",/\bGlobal Administrators?\b|\bGlobal Admins?\b/,"The most powerful role in Microsoft Entra ID. It can do anything in the tenant, including give itself any other access.","Changing security settings for the whole company.","Keep holders to a minimum. Microsoft recommends fewer than five."],
 ["jit","Just-in-time (eligible and active)",/\bjust-in-time\b|\beligible\b/i,"In PIM, an Eligible assignment means the person can switch the role on when they need it, for a limited time. An Active assignment is always on.","Eligible: activate Helpdesk Administrator for 4 hours to fix a password problem.","Always-on admin access is waiting to be stolen. Eligible is the safe default for people."],
 ["breakglass","Emergency access (break-glass) account",/\bbreak-glass\b|\bemergency access accounts?\b|\bemergency accounts?\b/i,"A spare admin account kept for emergencies, like an outage that locks normal admins out. It has permanent Global Administrator by design.","Protected by a hardware key, alerting Security on every sign-in, tested every 90 days.","Permanent admin looks wrong but is correct here. Test the controls around it instead."],
 ["sp","Service principal",/\bservice principals?\b/i,"The identity an app uses to sign in and act in Entra ID, like an account for software.","An HR connector that creates staff accounts automatically.","Apps can hold admin roles too, so they need an owner and a review."],
 ["ticket","Ticket (access request)",/\b(access request )?tickets?\b|\baccess requests?\b/i,"A record in the IT service desk system asking for something to be done, such as giving someone access. An access request ticket shows who asked, which roles they need, who approved it and when IT set it up.","A request for a new starter to get the role for entering invoices, approved by their manager and the system owner, and set up on their first day.","In an access review, the ticket is your evidence that access was approved. Compare it with what the person actually has: no ticket, or more access than the ticket asked for, is a finding."],
 ["breach","Data breach",/\bdata breach(es)?\b/i,"Personal or confidential data seen, copied, changed or lost by someone who shouldn't have it.","A former employee's account is used to export a list of staff salaries and bank details.","Data protection laws require breaches to be reported. In the EU, under the General Data Protection Regulation (GDPR), a personal data breach usually has to be reported to the regulator within 72 hours, and affected people may need to be told. Most countries have similar laws. Fines and loss of trust can follow."],
 ["svcacct","Service account",/\bservice accounts?\b/i,"An account used by an application or automated process, not by a person.","svc_bankfeed, which loads bank statements into the finance system every night.","Service accounts are often powerful and rarely watched, and their passwords seldom change. Each one needs a named owner and a regular review."],
 ["ca","Conditional Access",/\bConditional Access\b/,"Entra rules that decide when sign-in is allowed, such as requiring MFA or blocking unknown countries.","Admins must use MFA from a company device.","Emergency accounts are excluded so they still work if a rule goes wrong."],
 ["lateral","Lateral movement",/\blateral movement\b/i,"When an attacker uses one account or system they've broken into as a stepping stone to reach others.","Using a stolen admin account for the finance system to get into email and file shares.","It's why one stolen privileged account can become a company-wide breach."],
 ["mfa","MFA",/\bMFA\b/,"Multi-factor authentication: proving it's you with something more than a password, such as an app prompt or a security key.","A password plus a tap on your phone.","It stops most attacks that use stolen passwords."],
 ["fido","FIDO2 key",/\bFIDO2\b/,"A physical security key used to sign in. It can't be phished like a password or a text code.","A USB key you touch to sign in.","Recommended for the most powerful accounts."],
 ["tier0","Tier 0",/\bTier 0\b/,"The most powerful roles, which can take over everything else.","Global Administrator and Privileged Role Administrator.","These get the strictest controls, like approval for every activation."],
